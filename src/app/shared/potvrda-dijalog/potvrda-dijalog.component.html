<h2 mat-dialog-title>{{ podaci.naslov }}</h2>

<mat-dialog-content>
  <p>{{ podaci.poruka }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Odustani</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">Potvrdi</button>
</mat-dialog-actions>

<div class="kontejner" *ngIf="korisnik as k">

  <h1 class="naslov-stranice">Moj nalog</h1>
  <p class="podnaslov-stranice">{{ k.ime }} {{ k.prezime }} ({{ k.email }})</p>

  <mat-tab-group class="panel">

    <mat-tab label="Licni podaci">
      <form [formGroup]="forma" class="sadrzaj" (ngSubmit)="sacuvaj()">
        <div class="red g8">
          <mat-form-field>
            <mat-label>Ime</mat-label>
            <input matInput formControlName="ime">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Prezime</mat-label>
            <input matInput formControlName="prezime">
          </mat-form-field>
        </div>

        <div class="red g8">
          <mat-form-field>
            <mat-label>E-adresa</mat-label>
            <input matInput formControlName="email">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Telefon</mat-label>
            <input matInput formControlName="telefon">
          </mat-form-field>
        </div>

        <div class="red g8">
          <mat-form-field>
            <mat-label>Adresa</mat-label>
            <input matInput formControlName="adresa">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Grad</mat-label>
            <input matInput formControlName="grad">
          </mat-form-field>
        </div>

        <button mat-raised-button color="primary" type="submit">Sacuvaj izmene</button>
      </form>
    </mat-tab>

    <mat-tab label="Moje porudzbine">
      <div class="sadrzaj">

        <p *ngIf="porudzbine.length === 0">Nemate nijednu porudzbinu.</p>

        <table mat-table [dataSource]="porudzbine" class="puna-sirina" *ngIf="porudzbine.length > 0">
          <ng-container matColumnDef="broj">
            <th mat-header-cell *matHeaderCellDef>Broj</th>
            <td mat-cell *matCellDef="let p">{{ p.broj }}</td>
          </ng-container>
          <ng-container matColumnDef="datum">
            <th mat-header-cell *matHeaderCellDef>Datum</th>
            <td mat-cell *matCellDef="let p">{{ p.datum }}</td>
          </ng-container>
          <ng-container matColumnDef="artikli">
            <th mat-header-cell *matHeaderCellDef>Artikala</th>
            <td mat-cell *matCellDef="let p">{{ brojArtikala(p) }}</td>
          </ng-container>
          <ng-container matColumnDef="iznos">
            <th mat-header-cell *matHeaderCellDef>Iznos</th>
            <td mat-cell *matCellDef="let p">{{ p.ukupno }} RSD</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let p"><span class="oznaka">{{ p.status }}</span></td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="kolone"></tr>
          <tr mat-row *matRowDef="let red; columns: kolone;"></tr>
        </table>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
